<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" rx="5" ry="5"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#333">
    .NET Aspire AI System Architecture
  </text>
  
  <!-- External World Section -->
  <rect x="50" y="70" width="700" height="90" fill="#e9ecef" rx="5" ry="5" stroke="#ced4da" stroke-width="1"/>
  <text x="400" y="90" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">
    External Clients
  </text>
  <rect x="100" y="100" width="120" height="40" fill="#fff" rx="5" ry="5" stroke="#6c757d" stroke-width="1"/>
  <text x="160" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">
    Web App
  </text>
  <rect x="240" y="100" width="120" height="40" fill="#fff" rx="5" ry="5" stroke="#6c757d" stroke-width="1"/>
  <text x="300" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">
    Mobile App
  </text>
  <rect x="380" y="100" width="120" height="40" fill="#fff" rx="5" ry="5" stroke="#6c757d" stroke-width="1"/>
  <text x="440" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">
    Third-party Services
  </text>
  <rect x="520" y="100" width="120" height="40" fill="#fff" rx="5" ry="5" stroke="#6c757d" stroke-width="1"/>
  <text x="580" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">
    Desktop App
  </text>
  
  <!-- API Gateway Layer -->
  <rect x="50" y="180" width="700" height="70" fill="#d0ebff" rx="5" ry="5" stroke="#4dabf7" stroke-width="1"/>
  <text x="400" y="210" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">
    API Gateway (YARP/Ocelot)
  </text>
  <text x="400" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">
    Authentication | Rate Limiting | Request Routing | Logging
  </text>
  
  <!-- Service Layer -->
  <rect x="50" y="270" width="700" height="140" fill="#d8f5a2" rx="5" ry="5" stroke="#94d82d" stroke-width="1"/>
  <text x="400" y="290" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">
    .NET Aspire Services
  </text>
  
  <!-- Individual Services -->
  <rect x="70" y="310" width="160" height="80" fill="#fff" rx="5" ry="5" stroke="#6c757d" stroke-width="1"/>
  <text x="150" y="330" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">
    REST API Service
  </text>
  <text x="150" y="350" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    External-facing
  </text>
  <text x="150" y="365" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    RESTful endpoints
  </text>
  <text x="150" y="380" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    OpenAPI documentation
  </text>
  
  <rect x="250" y="310" width="160" height="80" fill="#fff" rx="5" ry="5" stroke="#6c757d" stroke-width="1"/>
  <text x="330" y="330" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">
    gRPC Service
  </text>
  <text x="330" y="350" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    Internal communication
  </text>
  <text x="330" y="365" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    High-performance
  </text>
  <text x="330" y="380" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    Protobuf contracts
  </text>
  
  <rect x="430" y="310" width="160" height="80" fill="#fff" rx="5" ry="5" stroke="#6c757d" stroke-width="1"/>
  <text x="510" y="330" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">
    Plugin Service
  </text>
  <text x="510" y="350" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    Dynamic loading
  </text>
  <text x="510" y="365" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    Custom capabilities
  </text>
  <text x="510" y="380" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    Hot-reloading
  </text>
  
  <rect x="610" y="310" width="120" height="80" fill="#fff" rx="5" ry="5" stroke="#6c757d" stroke-width="1"/>
  <text x="670" y="330" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">
    Worker Service
  </text>
  <text x="670" y="350" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    Background tasks
  </text>
  <text x="670" y="365" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    Queued operations
  </text>
  <text x="670" y="380" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    Scheduled jobs
  </text>
  
  <!-- AI Core Layer -->
  <rect x="50" y="430" width="700" height="120" fill="#ffd8a8" rx="5" ry="5" stroke="#ffa94d" stroke-width="1"/>
  <text x="400" y="450" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">
    AI Core Components
  </text>
  
  <rect x="70" y="470" width="160" height="60" fill="#fff" rx="5" ry="5" stroke="#6c757d" stroke-width="1"/>
  <text x="150" y="490" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">
    Semantic Kernel
  </text>
  <text x="150" y="510" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    Core AI orchestration
  </text>
  
  <rect x="250" y="470" width="160" height="60" fill="#fff" rx="5" ry="5" stroke="#6c757d" stroke-width="1"/>
  <text x="330" y="490" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">
    SK Prompty
  </text>
  <text x="330" y="510" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    Prompt engineering
  </text>
  
  <rect x="430" y="470" width="160" height="60" fill="#fff" rx="5" ry="5" stroke="#6c757d" stroke-width="1"/>
  <text x="510" y="490" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">
    Agent Framework
  </text>
  <text x="510" y="510" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    Multi-agent orchestration
  </text>
  
  <rect x="610" y="470" width="120" height="60" fill="#fff" rx="5" ry="5" stroke="#6c757d" stroke-width="1"/>
  <text x="670" y="490" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">
    SK Memory
  </text>
  <text x="670" y="510" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
    Vector storage/caching
  </text>
  
  <!-- Connection Lines -->
  <!-- External to Gateway -->
  <line x1="160" y1="140" x2="160" y2="180" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="5,2"/>
  <line x1="300" y1="140" x2="300" y2="180" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="5,2"/>
  <line x1="440" y1="140" x2="440" y2="180" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="5,2"/>
  <line x1="580" y1="140" x2="580" y2="180" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="5,2"/>
  
  <!-- Gateway to Services -->
  <line x1="150" y1="250" x2="150" y2="310" stroke="#4dabf7" stroke-width="1.5"/>
  <line x1="330" y1="250" x2="330" y2="310" stroke="#4dabf7" stroke-width="1.5"/>
  <line x1="510" y1="250" x2="510" y2="310" stroke="#4dabf7" stroke-width="1.5"/>
  <line x1="670" y1="250" x2="670" y2="310" stroke="#4dabf7" stroke-width="1.5"/>
  
  <!-- Services to AI Core -->
  <line x1="150" y1="390" x2="150" y2="470" stroke="#94d82d" stroke-width="1.5"/>
  <line x1="330" y1="390" x2="330" y2="470" stroke="#94d82d" stroke-width="1.5"/>
  <line x1="510" y1="390" x2="510" y2="470" stroke="#94d82d" stroke-width="1.5"/>
  <line x1="670" y1="390" x2="670" y2="470" stroke="#94d82d" stroke-width="1.5"/>
  
  <!-- Horizontal connections between services -->
  <path d="M 230 350 L 250 350" stroke="#555" stroke-width="1.5"/>
  <path d="M 410 350 L 430 350" stroke="#555" stroke-width="1.5"/>
  <path d="M 590 350 L 610 350" stroke="#555" stroke-width="1.5"/>
  
  <!-- Horizontal connections between AI components -->
  <path d="M 230 500 L 250 500" stroke="#555" stroke-width="1.5"/>
  <path d="M 410 500 L 430 500" stroke="#555" stroke-width="1.5"/>
  <path d="M 590 500 L 610 500" stroke="#555" stroke-width="1.5"/>
</svg>
